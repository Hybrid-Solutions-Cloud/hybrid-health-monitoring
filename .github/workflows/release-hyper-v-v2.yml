name: Release Hyper-V Private Cloud Monitoring v2

on:
  workflow_dispatch:
    inputs:
      version:
        description: Four-part Management Pack version
        required: true
        type: string
      evidence_path:
        description: Repository-relative approved runtime evidence receipt
        required: true
        type: string
      release_notes_path:
        description: Repository-relative Markdown release notes
        required: true
        default: src/hyper-v/scom-mp/v2/release/RELEASE_NOTES.md
        type: string

permissions:
  contents: write
  id-token: write

concurrency:
  group: hyper-v-private-cloud-production-release
  cancel-in-progress: false

jobs:
  release:
    name: Governed seal, validate, and publish
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Windows, X64, scom-mp-release]
    environment: hyper-v-scom-production-release
    env:
      HCS_DEPENDENCY_PATHS: ${{ vars.HYPERV_SCOM_RELEASE_DEPENDENCY_PATHS }}
      HCS_KEY_VAULT_NAME: ${{ vars.HCS_KEY_VAULT_NAME }}
      HCS_SIGNING_SECRET_NAME: ${{ vars.HYPERV_SCOM_SIGNING_SECRET_NAME }}
    steps:
      - name: Checkout the exact main commit
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate protected runner and release inputs
        shell: pwsh
        env:
          HCS_VERSION: ${{ inputs.version }}
          HCS_EVIDENCE_INPUT: ${{ inputs.evidence_path }}
          HCS_NOTES_INPUT: ${{ inputs.release_notes_path }}
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          if ($env:HCS_VERSION -notmatch '^\d+\.\d+\.\d+\.\d+$') {
              throw 'version must be a four-part Management Pack version.'
          }
          foreach ($command in @('az', 'gh', 'git', 'pwsh')) {
              if ($null -eq (Get-Command $command -ErrorAction SilentlyContinue)) {
                  throw "Required release-runner command is unavailable: $command"
              }
          }
          foreach ($path in @(
                  'C:\Program Files (x86)\MSBuild\Microsoft\VSAC\Microsoft.SystemCenter.Authoring.Build.dll',
                  'C:\Program Files (x86)\MSBuild\Microsoft\VSAC\Microsoft.EnterpriseManagement.Packaging.dll',
                  'C:\Program Files (x86)\System Center Visual Studio 2022 Authoring Extensions\Tools\FASTSEAL.exe'
              )) {
              if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
                  throw "Required Microsoft VSAE component is unavailable: $path"
              }
          }
          foreach ($name in @('HCS_DEPENDENCY_PATHS', 'HCS_KEY_VAULT_NAME', 'HCS_SIGNING_SECRET_NAME')) {
              if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) {
                  throw "Required protected-environment variable is unset: $name"
              }
          }
          $dependencyPaths = @($env:HCS_DEPENDENCY_PATHS.Split(';', [StringSplitOptions]::RemoveEmptyEntries))
          if ($dependencyPaths.Count -eq 0) { throw 'No release dependency directories were configured.' }
          foreach ($path in $dependencyPaths) {
              if (-not (Test-Path -LiteralPath $path -PathType Container)) {
                  throw "Configured release dependency directory is unavailable: $path"
              }
          }
          $workspace = [IO.Path]::GetFullPath($env:GITHUB_WORKSPACE)
          $evidencePath = [IO.Path]::GetFullPath((Join-Path $workspace $env:HCS_EVIDENCE_INPUT))
          $notesPath = [IO.Path]::GetFullPath((Join-Path $workspace $env:HCS_NOTES_INPUT))
          foreach ($path in @($evidencePath, $notesPath)) {
              $relativePath = [IO.Path]::GetRelativePath($workspace, $path)
              $escapesWorkspace = [IO.Path]::IsPathRooted($relativePath) -or
                  $relativePath -eq '..' -or
                  $relativePath.StartsWith("..$([IO.Path]::DirectorySeparatorChar)", [StringComparison]::Ordinal)
              if ($escapesWorkspace -or
                  -not (Test-Path -LiteralPath $path -PathType Leaf)) {
                  throw "Release input must be an existing file under the checked-out repository: $path"
              }
          }
          $packageRoot = Join-Path $env:RUNNER_TEMP "hcs-hyper-v-release-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          $signingKeyPath = Join-Path $env:RUNNER_TEMP "hcs-hyper-v-signing-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT.snk"
          if (Test-Path -LiteralPath $packageRoot) { throw "Unique package path already exists: $packageRoot" }
          if (Test-Path -LiteralPath $signingKeyPath) { throw "Unique signing-key path already exists: $signingKeyPath" }
          "HCS_PACKAGE_ROOT=$packageRoot" | Out-File -LiteralPath $env:GITHUB_ENV -Append -Encoding utf8
          "HCS_SIGNING_KEY_PATH=$signingKeyPath" | Out-File -LiteralPath $env:GITHUB_ENV -Append -Encoding utf8
          "HCS_EVIDENCE_PATH=$evidencePath" | Out-File -LiteralPath $env:GITHUB_ENV -Append -Encoding utf8
          "HCS_RELEASE_NOTES_PATH=$notesPath" | Out-File -LiteralPath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Authenticate to Azure with OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Materialize the permanent signing key in runner temp
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $encodedKey = az keyvault secret show --vault-name $env:HCS_KEY_VAULT_NAME `
              --name $env:HCS_SIGNING_SECRET_NAME --query value --output tsv
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($encodedKey)) {
              throw 'The governed signing key could not be retrieved from Azure Key Vault.'
          }
          Write-Output "::add-mask::$encodedKey"
          try {
              $keyBytes = [Convert]::FromBase64String($encodedKey)
              [IO.File]::WriteAllBytes($env:HCS_SIGNING_KEY_PATH, $keyBytes)
          }
          finally {
              $encodedKey = $null
              $keyBytes = $null
          }

      - name: Build, verify, seal, and package
        shell: pwsh
        env:
          HCS_VERSION: ${{ inputs.version }}
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $dependencyPaths = [string[]]@($env:HCS_DEPENDENCY_PATHS.Split(';', [StringSplitOptions]::RemoveEmptyEntries))
          & ./src/hyper-v/scom-mp/v2/tools/New-HyperVPrivateCloudReleasePackage.ps1 `
              -Version $env:HCS_VERSION `
              -SigningKeyPath $env:HCS_SIGNING_KEY_PATH `
              -DependencyPath $dependencyPaths `
              -OutputPath $env:HCS_PACKAGE_ROOT `
              -BuildMode Release `
              -ApprovedReleaseSigningIdentity `
              -ReleaseEvidencePath $env:HCS_EVIDENCE_PATH

      - name: Enforce production release eligibility
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          & ./src/hyper-v/scom-mp/v2/tools/Test-HyperVPrivateCloudReleasePackage.ps1 `
              -PackagePath $env:HCS_PACKAGE_ROOT `
              -RequireReleaseEligible

      - name: Retain the exact approved assets
        uses: actions/upload-artifact@v7
        with:
          name: hyper-v-private-cloud-${{ inputs.version }}
          path: ${{ runner.temp }}\hcs-hyper-v-release-${{ github.run_id }}-${{ github.run_attempt }}\assets\*
          if-no-files-found: error
          compression-level: 0
          retention-days: 90

      - name: Publish immutable GitHub release assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          HCS_VERSION: ${{ inputs.version }}
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $tag = "hyper-v-private-cloud-v$env:HCS_VERSION"
          & gh release view $tag --repo $env:GITHUB_REPOSITORY 2>$null
          if ($LASTEXITCODE -eq 0) { throw "Release '$tag' already exists and will not be overwritten." }
          $assets = @(Get-ChildItem -LiteralPath (Join-Path $env:HCS_PACKAGE_ROOT 'assets') -File | Sort-Object Name)
          if ($assets.Count -eq 0) { throw 'No validated release assets were found.' }
          $arguments = @(
              'release', 'create', $tag,
              '--repo', $env:GITHUB_REPOSITORY,
              '--target', $env:GITHUB_SHA,
              '--title', "Hyper-V Private Cloud Monitoring $env:HCS_VERSION",
              '--notes-file', $env:HCS_RELEASE_NOTES_PATH,
              '--latest'
          ) + @($assets.FullName)
          & gh @arguments
          if ($LASTEXITCODE -ne 0) { throw "GitHub release publication failed for '$tag'." }

      - name: Verify stable latest-download URLs
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $base = "https://github.com/$env:GITHUB_REPOSITORY/releases/latest/download"
          foreach ($file in @(
                  'Hyper-V-Private-Cloud-Monitoring-Complete.zip',
                  'Hyper-V-Private-Cloud-Monitoring-Core.zip',
                  'Hyper-V-Private-Cloud-Monitoring-Overrides.zip',
                  'release-manifest.json',
                  'SHA256SUMS.txt'
              )) {
              $response = Invoke-WebRequest -Uri "$base/$file" -Method Head -MaximumRedirection 10 `
                  -Headers @{ Authorization = "Bearer $env:GH_TOKEN" }
              if ($response.StatusCode -lt 200 -or $response.StatusCode -ge 400) {
                  throw "Stable latest-download verification failed for '$file': HTTP $($response.StatusCode)."
              }
          }

      - name: Remove signing material
        if: always()
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          if (-not [string]::IsNullOrWhiteSpace($env:HCS_SIGNING_KEY_PATH) -and
              (Test-Path -LiteralPath $env:HCS_SIGNING_KEY_PATH -PathType Leaf)) {
              [IO.File]::Delete($env:HCS_SIGNING_KEY_PATH)
          }
